server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API na mesma origem: o front chama /api/... e o Nginx encaminha para o
    # container do Spring Boot. Como a origem e a mesma, nao existe CORS.
    #
    # proxy_pass sem caminho final preserva a URI original (/api/conversas).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React nao existem no disco, entao qualquer caminho
    # desconhecido devolve o index.html e o roteador assume.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
